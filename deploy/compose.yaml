services:
  web:
    image: ghcr.io/jake-landersweb/pucknorris.com:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0700
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_HOST: ${CHAT_HOST}
      HOST: ${HOST}
      NEXT_PUBLIC_TEAMID: ${NEXT_PUBLIC_TEAMID}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN}
      SHOPIFY_STORE_FRONT_ACCESS_TOKEN: ${SHOPIFY_STORE_FRONT_ACCESS_TOKEN}
      TEAMID: ${TEAMID}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASS: ${MYSQL_PASS}
      MYSQL_DB: ${MYSQL_DB}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.pucknorris-spokane2-http.rule=Host(`pucknorris.com`) || Host(`www.pucknorris.com`)
      - traefik.http.routers.pucknorris-spokane2-http.entrypoints=web
      - traefik.http.routers.pucknorris-spokane2-http.middlewares=redirect-to-https@file
      - traefik.http.routers.pucknorris-spokane2.rule=Host(`pucknorris.com`) || Host(`www.pucknorris.com`)
      - traefik.http.routers.pucknorris-spokane2.entrypoints=websecure
      - traefik.http.routers.pucknorris-spokane2.tls.certresolver=letsencrypt
      - traefik.http.services.pucknorris-spokane2.loadbalancer.server.port=3000
networks:
  dokploy-network:
    external: true
